services:
  web-gateway:
    build:
      context: ./services/web-gateway
      dockerfile: Dockerfile
    ports:
      - "${WEB_GATEWAY_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - postgres
      - redis
    networks:
      - dispatch-net
    restart: unless-stopped

  matching-engine:
    build:
      context: ./services/matching-engine
      dockerfile: Dockerfile
    ports:
      - "${MATCHING_ENGINE_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - postgres
      - redis
    networks:
      - dispatch-net
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dispatch_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dispatch_pass}
      - POSTGRES_DB=${POSTGRES_DB:-dispatch_mesh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dispatch-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - dispatch-net
    restart: unless-stopped

networks:
  dispatch-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
